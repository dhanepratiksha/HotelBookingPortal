# ===================================================================
# Hotel Booking Portal - Spring Boot Application Configuration
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=hotel-booking-portal

# Active Profile: Defaults to 'h2' for zero-setup instant local running.
# Change to 'mysql' or pass --spring.profiles.active=mysql for MySQL.
spring.profiles.active=h2

# CORS Configuration (Configured for React Vite Frontend on port 5173)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
